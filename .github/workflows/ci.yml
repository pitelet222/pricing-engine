name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Schema & config unit tests with coverage gate
  #
  # Covers modules that can be fully tested without model artifacts:
  #   src/api/schemas.py     src/config.py          src/api/auth.py
  #   src/api/metrics.py     src/api/logging.py     src/api/rate_limit.py
  #   src/dashboard/charts.py
  #   src/data/preprocessing.py  src/data/features.py
  #   src/evaluation/metrics.py  src/models/forecaster.py
  #   src/models/pricer.py       src/models/uncertainty.py
  #   src/evaluation/explainability.py
  #
  # Coverage threshold is set on those modules only so the gate is meaningful
  # rather than trivially low due to uncoverable artifact-gated code.
  # ---------------------------------------------------------------------------
  test:
    name: Schema & unit tests (+ coverage)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "fastapi>=0.109" \
            "pydantic>=2.5" \
            "pydantic-settings>=2.2" \
            "prometheus-client>=0.20" \
            "numpy>=1.24" \
            "pandas>=2.0" \
            "plotly>=5.18" \
            "joblib>=1.3" \
            "pytest>=8.0" \
            "pytest-cov>=5.0" \
            "httpx>=0.27"

      - name: Run tests with coverage
        run: |
          pytest \
            tests/test_schemas.py \
            tests/test_config.py \
            tests/test_rate_limit.py \
            tests/test_charts.py \
            tests/test_loader_unit.py \
            tests/test_preprocessing.py \
            tests/test_features.py \
            tests/test_metrics.py \
            tests/test_forecaster.py \
            tests/test_pricer.py \
            tests/test_uncertainty.py \
            tests/test_explainability.py \
            --cov=src/api/schemas \
            --cov=src/config \
            --cov=src/api/auth \
            --cov=src/api/metrics \
            --cov=src/api/logging \
            --cov=src/api/rate_limit \
            --cov=src/dashboard/charts \
            --cov=src/data/preprocessing \
            --cov=src/data/features \
            --cov=src/evaluation/metrics \
            --cov=src/models/forecaster \
            --cov=src/models/pricer \
            --cov=src/models/uncertainty \
            --cov=src/evaluation/explainability \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 2 — Import sanity check
  # ---------------------------------------------------------------------------
  imports:
    name: Import sanity check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "fastapi>=0.109" \
            "pydantic>=2.5" \
            "pydantic-settings>=2.2" \
            "prometheus-client>=0.20" \
            "numpy>=1.24" \
            "pandas>=2.0"

      - name: Verify schemas import cleanly
        run: python -c "from src.api.schemas import *; print('schemas OK')"

      - name: Verify config imports cleanly
        run: python -c "from src.config import settings; print('config OK:', settings.api_version)"

      - name: Verify routes import cleanly
        run: python -c "from src.api.routes import router; print('routes OK')"

      - name: Verify auth imports cleanly
        run: python -c "from src.api.auth import verify_api_key; print('auth OK')"

      - name: Verify metrics import cleanly
        run: python -c "from src.api.metrics import REQUEST_COUNT; print('metrics OK')"

      - name: Verify logging module imports cleanly
        run: python -c "from src.api.logging import JsonFormatter; print('logging OK')"

      - name: Verify rate_limit imports cleanly
        run: python -c "from src.api.rate_limit import check_rate_limit; print('rate_limit OK')"

      - name: Verify preprocessing imports cleanly
        run: python -c "from src.data.preprocessing import clean_data; print('preprocessing OK')"

      - name: Verify features imports cleanly
        run: python -c "from src.data.features import build_features; print('features OK')"

      - name: Verify evaluation metrics imports cleanly
        run: python -c "from src.evaluation.metrics import compute_metrics; print('eval metrics OK')"

      - name: Verify forecaster imports cleanly
        run: python -c "from src.models.forecaster import build_nixtla_df; print('forecaster OK')"

      - name: Verify pricer imports cleanly
        run: python -c "from src.models.pricer import optimize_price; print('pricer OK')"

      - name: Verify uncertainty imports cleanly
        run: python -c "from src.models.uncertainty import compute_conformal_pi; print('uncertainty OK')"

      - name: Verify explainability imports cleanly
        run: python -c "from src.evaluation.explainability import build_top_drivers; print('explainability OK')"

  # ---------------------------------------------------------------------------
  # Job 3 — Ruff linting
  # ---------------------------------------------------------------------------
  lint:
    name: Ruff linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Run ruff
        run: ruff check src/ tests/ scripts/

  # ---------------------------------------------------------------------------
  # Job 4 — OpenAPI spec up-to-date
  # ---------------------------------------------------------------------------
  openapi:
    name: OpenAPI spec up-to-date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "fastapi>=0.109" \
            "pydantic>=2.5" \
            "pydantic-settings>=2.2" \
            "prometheus-client>=0.20"

      - name: Regenerate OpenAPI spec
        run: python scripts/export_openapi.py

      - name: Verify spec is committed and current
        run: git diff --exit-code docs/openapi.json
