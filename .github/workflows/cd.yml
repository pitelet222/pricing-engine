name: CD

# Triggers:
#   master push  → build + push :latest images to GHCR, run Trivy scan
#   v*.*.* tag   → same as above but with versioned tags, then create GitHub Release
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Build and push Docker images to GitHub Container Registry
  #
  # Produces two images per run:
  #   ghcr.io/pitelet222/pricing-engine-api
  #   ghcr.io/pitelet222/pricing-engine-dashboard
  #
  # Tag strategy (via docker/metadata-action):
  #   master push  → :latest
  #   v1.2.3 tag   → :1.2.3, :1.2, :latest
  #
  # Layer cache is persisted across runs via GitHub Actions cache (type=gha)
  # so subsequent builds only rebuild changed layers.
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      api-digest: ${{ steps.build-api.outputs.digest }}
      dashboard-digest: ${{ steps.build-dashboard.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- API image --------------------------------------------------------

      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pitelet222/pricing-engine-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ---- Dashboard image --------------------------------------------------

      - name: Extract dashboard image metadata
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pitelet222/pricing-engine-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push dashboard image
        id: build-dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ---------------------------------------------------------------------------
  # Job 2 — Trivy vulnerability scan
  #
  # Scans both images for CRITICAL and HIGH CVEs immediately after they are
  # pushed. Results are uploaded to GitHub Security (SARIF format) so they
  # appear in the repository's Security → Code scanning tab.
  #
  # ignore-unfixed: true skips CVEs that have no available patch yet, keeping
  # the signal actionable. Only CRITICAL severity fails the job; HIGH CVEs are
  # surfaced as warnings given the deep ML dependency stack.
  # ---------------------------------------------------------------------------
  trivy-api:
    name: Trivy scan (API image)
    runs-on: ubuntu-latest
    needs: [build-push]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/pitelet222/pricing-engine-api@${{ needs.build-push.outputs.api-digest }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

  trivy-dashboard:
    name: Trivy scan (dashboard image)
    runs-on: ubuntu-latest
    needs: [build-push]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan dashboard image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/pitelet222/pricing-engine-dashboard@${{ needs.build-push.outputs.dashboard-digest }}
          format: sarif
          output: trivy-dashboard.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-dashboard.sarif
          category: trivy-dashboard

  # ---------------------------------------------------------------------------
  # Job 3 — GitHub Release (tags only)
  #
  # Runs only when a v*.*.* tag is pushed and both Trivy scans pass.
  # Automatically generates release notes from commits since the last tag and
  # attaches the OpenAPI spec as a downloadable release asset.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [trivy-api, trivy-dashboard]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: docs/openapi.json
