version: "3.9"

# Run all notebooks (01 → 06) first to generate data/outputs/ and data/processed/.
# Then: docker-compose up
#
#   Dashboard → http://localhost:8501
#   API docs  → http://localhost:8000/docs

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount pre-generated artifacts (gitignored, must exist locally)
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      api:
        condition: service_healthy
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
