line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — ruff format handles this; don't double-enforce
]

[lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert is expected in tests
]
